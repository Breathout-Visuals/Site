  <!-- PRELOADER (Inline for instant render) -->
  <style>
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050505;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @media (max-width: 768px) {
      .preloader-content {
        transform: scale(2.0);
      }
    }

    .preloader-brand {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    .preloader-bar-container {
      width: 160px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      border-radius: 2px;
    }

    .preloader-bar {
      width: 100%;
      height: 100%;
      background: #ffffff;
      transform: translateX(-100%);
      animation: simulateLoad 1.5s cubic-bezier(0.2, 0, 0.2, 1) forwards;
    }

    @keyframes simulateLoad {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(-15%); }
    }
  </style>
  <div id="preloader">
    <div class="preloader-content">
      <div class="preloader-brand">BREATHOUT</div>
      <div class="preloader-bar-container">
        <div class="preloader-bar"></div>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      const bar = preloader.querySelector('.preloader-bar');
      
      // Stop simulation and force completion
      bar.style.animation = 'none';
      void bar.offsetWidth; // Force reflow
      bar.style.transition = 'transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
      bar.style.transform = 'translateX(0)';

      setTimeout(() => {
        preloader.classList.add('hidden');
      }, 500); // Wait for bar to finish before fading out
    });
  </script>
