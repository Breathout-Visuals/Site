<!DOCTYPE html>

  <link rel="icon" type="image/png" href="/favicon.png" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <!-- NAV -->
  <nav class="nav" id="nav">
    <a class="nav-logo" onclick="window.location.href='/'">LUCAS JACQUOT</a>
    <div class="nav-links">
      <a onclick="window.location.href='/'" class="nav-item">Accueil</a>
      <a onclick="window.location.href='/portfolio-freelance/projets.html'" class="nav-item">Projets</a>
      <a onclick="window.location.href='/portfolio-freelance/contact.html'" class="nav-item">Contact</a>
    </div>
    <button class="nav-lang" id="lang-btn">EN</button>
    <button class="nav-burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>

  <div class="mobile-menu" id="mobile-menu">
    <a onclick="window.location.href='/'">Accueil</a>
    <a onclick="window.location.href='/portfolio-freelance/projets.html'">Projets</a>
    <a onclick="window.location.href='/portfolio-freelance/contact.html'">Contact</a>
    <div class="mobile-menu-footer">© 2025 Lucas Jacquot</div>
  </div>


  <!-- HERO IMAGE -->
  <div class="proj-hero" id="proj-hero">
    <!-- Image injected by JS -->
  </div>

  <!-- INFO BAR -->
  <div class="proj-info-bar" id="proj-info-bar">
    <div class="proj-info-item">
      <span class="proj-info-label" id="lbl-cat">Catégorie</span>
      <span class="proj-info-value" id="info-cat">—</span>
    </div>
    <div class="proj-info-item">
      <span class="proj-info-label" id="lbl-client">Client</span>
      <span class="proj-info-value" id="info-client">—</span>
    </div>
    <div class="proj-info-item">
      <span class="proj-info-label" id="lbl-date">Date</span>
      <span class="proj-info-value" id="info-date">—</span>
    </div>
  </div>

  <!-- BODY -->
  <div class="proj-body">
    <h1 class="proj-title" id="proj-title">—</h1>
    <p class="proj-client" id="proj-client-sub"></p>
    <p class="proj-desc" id="proj-desc">—</p>
    
    <div class="proj-credits" id="proj-credits"></div>
    <a class="proj-video-link hidden-initially" id="proj-video-link" href="#" target="_blank" rel="noopener">
      ▶ Voir le projet
    </a>
  </div>

  <!-- VIDEO EMBED (YouTube / Vimeo) -->
  <div class="proj-video-embed hidden-initially" id="proj-video-embed"></div>

  <!-- GALLERY -->
  <div class="proj-gallery" id="proj-gallery"></div>

  <!-- NEXT PROJECT -->
  <a class="proj-next" id="proj-next">
    <div>
      <p class="proj-next-label" id="lbl-next">Projet suivant</p>
      <p class="proj-next-name" id="next-name">—</p>
      <p class="proj-next-infos" id="next-infos"></p>
    </div>
    <span class="proj-next-arrow">→</span>
  </a>

  <div class="footer-bar">
    <span id="footer-copy">© 2025 Lucas Jacquot. Tous droits réservés.</span>
    <span>Breathout Visuals</span>
  </div>

  <script type="module" src="/src/portfolio-freelance/project.js"></script>
